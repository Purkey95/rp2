name: Static Analysis

on: [push, pull_request]

jobs:
  analyze:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: [3.9]
    env:
      PYTHONPATH: ./src:./tests
      MYPYPATH: ./src:./tests:./src/stubs
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings.
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=160 --statistics
      - name: Lint with pylint
        run: |
          pylint -r y src tests/*.py
      - name: Security check with bandit
        run: |
          bandit -r src/
      - name: Type check with mypy
        run: |
          mypy src/ tests/
      # tools/ holds standalone stdlib scripts, checked separately from the
      # package: they use their own mypy config (see tools/mypy.ini for why).
      - name: Lint tools with pylint
        run: |
          pylint -r n tools/*/*.py
      - name: Security check tools with bandit
        run: |
          bandit -q -r tools/
      - name: Type check tools with mypy
        run: |
          mypy --config-file tools/mypy.ini tools/
