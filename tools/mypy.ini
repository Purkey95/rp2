# Type-checking config for tools/, which is deliberately separate from the
# root mypy.ini used for src/ and tests/.
#
# Why a second config: the standalone tools under tools/ are pure-stdlib
# scripts that model their records as plain dicts parsed from JSON. The root
# config turns on disallow_any_expr / disallow_any_explicit / disallow_untyped_defs,
# which reject that style wholesale -- running it over tools/ reports ~1260
# errors, none of which is a defect. That is a config mismatch, not type debt:
# with those flags off the same code type-checks clean.
#
# So this config enables the checks that find real problems in untyped code
# (check_untyped_defs analyzes function bodies that have no annotations) and
# leaves the annotation-mandating flags off.
#
# To promote a tool to the root config's strictness, annotate its record shapes
# (TypedDicts for the estate/parcel/deed rows and the emitted match row) and move
# it into the mypy src/ tests/ invocation in the Makefile. For monitorclt_probate
# that is worth doing when the match row stops changing shape, since the same
# shape is also the probate.entity_match contract in schema.sql.

[mypy]
check_untyped_defs = True
no_implicit_optional = True
strict_equality = True
warn_redundant_casts = True
warn_unused_ignores = True
pretty = True
show_column_numbers = True
show_error_codes = True
