<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MonitorCLT Review</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#1b1b1b; --muted:#6b6b6b; --line:#e3e1dc; --ok:#1f7a4d; --bad:#a3352b; --warn:#9a6b00; --accent:#2a4d8f; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; gap:16px; padding:10px 20px; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .spacer { flex:1; }
  header input { padding:6px 8px; border:1px solid var(--line); border-radius:6px; }
  main { max-width:1200px; margin:18px auto; padding:0 16px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .card h2 { margin:0 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  table { width:100%; border-collapse:collapse; }
  td { padding:4px 6px; vertical-align:top; border-top:1px solid var(--line); }
  td:first-child { color:var(--muted); width:38%; }
  .hl { background:#fff3b0; border-radius:3px; padding:0 2px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; }
  .chip { border-radius:999px; padding:3px 10px; font-size:12px; border:1px solid var(--line); background:#fafafa; }
  .chip.pos { border-color:var(--ok); color:var(--ok); }
  .chip.neg { border-color:var(--bad); color:var(--bad); }
  .chip.flag { border-color:var(--warn); color:var(--warn); }
  .prob { font-size:28px; font-weight:600; }
  .bar { height:8px; background:#eee; border-radius:4px; overflow:hidden; margin:6px 0 10px; }
  .bar i { display:block; height:100%; background:var(--accent); }
  .actions { display:flex; gap:10px; align-items:center; margin-top:14px; flex-wrap:wrap; }
  button { padding:9px 16px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; font-size:14px; }
  button.confirm { background:var(--ok); color:#fff; border-color:var(--ok); }
  button.reject { background:var(--bad); color:#fff; border-color:var(--bad); }
  button:disabled { opacity:.5; cursor:default; }
  .note { flex:1; min-width:240px; padding:8px; border:1px solid var(--line); border-radius:8px; }
  .muted { color:var(--muted); }
  .kbd { font:12px ui-monospace,Menlo,monospace; background:#eee; padding:1px 5px; border-radius:4px; }
  .empty { text-align:center; padding:60px 0; color:var(--muted); }
  ul.list { margin:0; padding-left:18px; }
  .gate.ok::before { content:"✓ "; color:var(--ok); } .gate.fail::before { content:"✗ "; color:var(--bad); }
  .tabs button { padding:5px 10px; font-size:13px; border-radius:6px; margin-right:4px; }
  .tabs button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .cand { display:grid; grid-template-columns:28px 1fr 110px 90px; gap:10px; align-items:start; padding:10px 8px; border-top:1px solid var(--line); }
  .cand.chosen { background:#eef6f0; }
  .cand .p { font-weight:600; text-align:right; }
  .cand .st { font-size:12px; color:var(--muted); text-align:right; }
  .cand input { margin-top:4px; width:16px; height:16px; }
</style>
</head>
<body>
<header>
  <h1>MonitorCLT · Review</h1>
  <nav class="tabs"><button data-mode="groups" class="on">Estates</button><button data-mode="pairs">Pairs</button><button data-mode="audit">Audit sample</button></nav>
  <span id="count" class="muted"></span>
  <span class="spacer"></span>
  <label class="muted">Reviewer <input id="reviewer" placeholder="your name" size="14"></label>
  <span class="muted"><span class="kbd">c</span> confirm · <span class="kbd">r</span> reject · <span class="kbd">s</span> skip</span>
</header>
<main id="main"><div class="empty">Loading…</div></main>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const reviewerInput = $('#reviewer');
  try { reviewerInput.value = localStorage.getItem('monitorclt.reviewer') || ''; } catch (e) {}
  reviewerInput.addEventListener('change', () => { try { localStorage.setItem('monitorclt.reviewer', reviewerInput.value); } catch (e) {} });

  let queue = [], current = null, opened = 0, mode = 'groups', groupsList = [], currentGroup = null;
  document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => {
    mode = b.dataset.mode; document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b)); load().catch(showError);
  }));
  const showError = (e) => { $('#main').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; };
  async function load() { if (mode === 'groups') return loadGroups(); if (mode === 'audit') return loadAudit(); return loadQueue(); }

  async function loadGroups() {
    groupsList = (await api('/api/review/groups?limit=25')).groups;
    $('#count').textContent = groupsList.length + ' estates with open candidates';
    if (!groupsList.length) { $('#main').innerHTML = '<div class="empty">No estates waiting. Nice.</div>'; currentGroup = null; return; }
    showGroup(groupsList[0]);
  }

  function showGroup(g) {
    currentGroup = g; opened = Date.now();
    const subj = g.subject || {}; const sp = (g.subject_mention && g.subject_mention.parsed) || {};
    const tokens = [sp.first, sp.last].filter((t) => t && t.length > 1);
    const rows = g.candidates.map((c) => {
      const parcel = c.parcel || {};
      const chips = c.evidence.map((e) => '<span class="chip">' + esc(e.replace(/_/g, ' ')) + '</span>').join('') + c.flags.map((f) => '<span class="chip flag">' + esc(f.replace(/_/g, ' ')) + '</span>').join('');
      const checked = c.status === 'confirmed' ? 'checked' : '';
      const disabled = c.status !== 'pending' && c.decided_by === 'reviewer' ? 'disabled' : '';
      return '<label class="cand ' + (checked ? 'chosen' : '') + '"><input type="checkbox" data-right="' + esc(c.right_id) + '" ' + checked + ' ' + disabled + '>' +
        '<div><div>' + highlight(c.owner_name || '', tokens) + ' <span class="muted">· ' + esc(parcel.situs_norm || c.right_id) + '</span></div>' +
        '<div class="muted">' + esc(parcel.land_use || '') + ' ' + money(parcel.assessed_value) + (parcel.owner_mailing_norm ? ' · mails to ' + esc(parcel.owner_mailing_norm) : '') + '</div><div class="chips">' + chips + '</div></div>' +
        '<div class="p">' + (c.probability * 100).toFixed(1) + '%</div><div class="st">' + esc(c.status) + (c.decided_by === 'reviewer' ? '<br>by ' + esc(c.reviewer) : '') + '</div></label>';
    }).join('');
    $('#main').innerHTML = `
      <div class="card" style="margin-bottom:14px">
        <h2>${esc(g.left_id)} · pick the parcel(s) this estate holds</h2>
        <table>
          <tr><td>decedent</td><td><b>${esc(subj.decedent_name)}</b></td></tr>
          <tr><td>died / filed</td><td>${esc(subj.date_of_death || '?')} / ${esc(subj.filing_date || '?')}</td></tr>
          <tr><td>personal representative</td><td>${esc(subj.personal_rep_name || '—')}</td></tr>
          <tr><td>PR mailing address</td><td>${esc(subj.pr_mailing_address || '—')}</td></tr>
        </table>
      </div>
      <div class="card">
        <h2>${g.candidates.length} candidates · ${g.pending} pending</h2>
        ${rows}
        <div class="actions">
          <button class="confirm" id="btn-group">Confirm checked, reject the rest (c)</button>
          <button id="btn-none">None of these (r)</button>
          <button id="btn-skip">Skip (s)</button>
          <input class="note" id="note" placeholder="note for the audit trail (optional)">
          <span class="muted">${groupsList.length} estates</span>
        </div>
      </div>`;
    $('#btn-group').onclick = () => decideGroup(false);
    $('#btn-none').onclick = () => decideGroup(true);
    $('#btn-skip').onclick = () => { groupsList.push(groupsList.shift()); showGroup(groupsList[0]); };
  }

  async function decideGroup(none) {
    if (!currentGroup) return;
    const reviewer = reviewerInput.value.trim();
    if (!reviewer) { reviewerInput.focus(); reviewerInput.style.borderColor = '#a3352b'; return; }
    const confirm = none ? [] : Array.from(document.querySelectorAll('.cand input:checked')).map((i) => i.dataset.right);
    document.querySelectorAll('button').forEach((b) => b.disabled = true);
    try {
      await api('/api/review/groups/decide', {method: 'POST', body: JSON.stringify({left_id: currentGroup.left_id, confirm, reviewer, note: $('#note').value})});
    } catch (e) { alert(e.message); }
    await loadGroups();
  }

  async function loadAudit() {
    queue = (await api('/api/review/audit?limit=50')).queue;
    $('#count').textContent = queue.length + ' sampled auto-confirms to check';
    if (!queue.length) { $('#main').innerHTML = '<div class="empty">Nothing sampled for audit right now.</div>'; current = null; return; }
    await show(queue[0].id);
  }
  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const money = (v) => v == null ? '' : '$' + Number(v).toLocaleString();

  async function api(path, opts) {
    const r = await fetch(path, Object.assign({headers: {'Content-Type': 'application/json'}}, opts || {}));
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    return j;
  }

  async function loadQueue() {
    queue = (await api('/api/review/queue?limit=50&order=value')).queue;
    $('#count').textContent = queue.length + ' pending';
    if (!queue.length) { $('#main').innerHTML = '<div class="empty">Queue is empty. Nice.</div>'; current = null; return; }
    await show(queue[0].id);
  }

  function highlight(text, tokens) {
    let out = esc(text);
    tokens.filter(Boolean).forEach((t) => { out = out.replace(new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'), '<span class="hl">$1</span>'); });
    return out;
  }

  function recordTable(rec, tokens, order) {
    const keys = order.filter((k) => k in rec).concat(Object.keys(rec).filter((k) => !order.includes(k) && k !== 'county'));
    return '<table>' + keys.map((k) => '<tr><td>' + esc(k.replace(/_/g, ' ')) + '</td><td>' + highlight(rec[k], tokens) + '</td></tr>').join('') + '</table>';
  }

  async function show(id) {
    const d = await api('/api/matches/' + id);
    current = d; opened = Date.now();
    const m = d.match, L = d.left, R = d.right;
    const lp = L.mention.parsed || {}, rp = R.mention.parsed || {};
    const tokens = [lp.first, lp.last, lp.middle, rp.first, rp.last].filter((t) => t && t.length > 1);
    const positives = new Set(d.contributions.filter((c) => c.log_odds > 0).map((c) => c.feature));
    const negatives = new Set(d.contributions.filter((c) => c.log_odds < 0).map((c) => c.feature));
    const chips = m.evidence.map((e) => '<span class="chip ' + (positives.has(e) ? 'pos' : negatives.has(e) ? 'neg' : '') + '">' + esc(e.replace(/_/g, ' ')) + '</span>').join('')
      + m.flags.map((f) => '<span class="chip flag">' + esc(f.replace(/_/g, ' ')) + '</span>').join('');
    const gates = Object.entries(m.gates).map(([g, ok]) => '<li class="gate ' + (ok ? 'ok' : 'fail') + '">' + esc(g.replace(/_/g, ' ')) + '</li>').join('');
    const deeds = d.deeds.length ? '<ul class="list">' + d.deeds.map((x) => '<li>' + esc(x.recorded_date) + ' ' + esc(x.instrument_type) + ': ' + highlight(x.grantor_name, tokens) + ' → ' + highlight(x.grantee_name, tokens) + ' <span class="muted">' + esc(x.instrument_number) + '</span></li>').join('') + '</ul>' : '<span class="muted">none on file for this parcel</span>';
    const events = d.parcel_events.length ? '<ul class="list">' + d.parcel_events.map((e) => '<li>' + esc(e.occurred_at || e.observed_at.slice(0, 10)) + ' ' + esc(e.kind.replace(/_/g, ' ')) + '</li>').join('') + '</ul>' : '<span class="muted">no other signals on this parcel</span>';
    const parcel = R.parcel || {};
    $('#main').innerHTML = `
      <div class="card" style="margin-bottom:14px">
        <div style="display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap">
          <div><div class="prob">${(m.probability * 100).toFixed(1)}%</div><div class="muted">calibrated probability · tier ${esc(m.match_tier.replace(/_/g, ' '))}</div></div>
          <div style="flex:1;min-width:280px"><div class="bar"><i style="width:${m.probability * 100}%"></i></div><div class="chips">${chips}</div></div>
          <div><ul class="list" style="list-style:none;padding:0">${gates}</ul></div>
        </div>
      </div>
      <div class="row">
        <div class="card"><h2>${esc(L.mention.source)} · ${esc(L.mention.role)} · ${esc(m.left_id)}</h2>${recordTable(L.record, tokens, ['decedent_name', 'date_of_death', 'filing_date', 'case_status', 'personal_rep_name', 'pr_mailing_address', 'file_number'])}</div>
        <div class="card"><h2>${esc(R.mention.source)} · ${esc(R.mention.role)} · ${esc(m.right_id)}</h2>${recordTable(R.record, tokens, ['owner_name', 'situs_address', 'owner_mailing_address', 'pin', 'land_use', 'assessed_value', 'last_sale_date'])}
          <div class="muted" style="margin-top:6px">${esc(parcel.land_use || '')} ${money(parcel.assessed_value)}</div></div>
      </div>
      <div class="row" style="margin-top:14px">
        <div class="card"><h2>Deeds on this parcel</h2>${deeds}</div>
        <div class="card"><h2>Other signals on this parcel</h2>${events}</div>
      </div>
      <div class="card" style="margin-top:14px">
        <h2>Why the model thinks so</h2>
        <table>${d.contributions.map((c) => '<tr><td>' + esc(c.feature.replace(/_/g, ' ')) + '</td><td>' + (c.log_odds > 0 ? '+' : '') + c.log_odds.toFixed(2) + ' log-odds</td></tr>').join('')}</table>
        <div class="actions">
          <button class="confirm" id="btn-confirm">Confirm (c)</button>
          <button class="reject" id="btn-reject">Reject (r)</button>
          <button id="btn-skip">Skip (s)</button>
          <input class="note" id="note" placeholder="note for the audit trail (optional)">
          <span class="muted">${queue.length} in queue</span>
        </div>
      </div>`;
    $('#btn-confirm').onclick = () => decide('confirm');
    $('#btn-reject').onclick = () => decide('reject');
    $('#btn-skip').onclick = () => decide('skip');
  }

  async function decide(decision) {
    if (!current) return;
    const reviewer = reviewerInput.value.trim();
    if (!reviewer) { reviewerInput.focus(); reviewerInput.style.borderColor = '#a3352b'; return; }
    const id = current.match.id;
    const note = $('#note') ? $('#note').value : '';
    document.querySelectorAll('button').forEach((b) => b.disabled = true);
    try {
      await api('/api/matches/' + id + '/decision', {method: 'POST', body: JSON.stringify({decision, reviewer, note, seconds_spent: (Date.now() - opened) / 1000})});
    } catch (e) { alert(e.message); }
    queue = queue.filter((q) => q.id !== id);
    if (decision === 'skip') queue.push(current.match);
    $('#count').textContent = queue.length + ' pending';
    if (queue.length) await show(queue[0].id); else $('#main').innerHTML = '<div class="empty">Queue is empty. Nice.</div>';
  }

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (mode === 'groups') {
      if (e.key === 'c') decideGroup(false); else if (e.key === 'r') decideGroup(true); else if (e.key === 's' && groupsList.length) { groupsList.push(groupsList.shift()); showGroup(groupsList[0]); }
      return;
    }
    if (e.key === 'c') decide('confirm'); else if (e.key === 'r') decide('reject'); else if (e.key === 's') decide('skip');
  });
  load().catch(showError);
})();
</script>
</body>
</html>
