[build-system]
requires = ["setuptools >= 61"]
build-backend = "setuptools.build_meta"

[project]
name = "monitorclt"
version = "2.1.0"
description = "Public-records monitoring and entity resolution for real property: bitemporal source history, a calibrated explainable resolver, a reviewer loop that trains it, and a deny-by-default export policy."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
keywords = ["public records", "probate", "real estate", "entity resolution", "record linkage", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]
dependencies = []

[project.optional-dependencies]
dev = ["black", "flake8", "isort", "pytest"]

[project.scripts]
monitorclt = "monitorclt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
monitorclt = ["resolve/rules.json", "ui/*.html", "py.typed"]

[tool.black]
line-length = 160
target-version = ["py38"]

[tool.isort]
profile = "black"
line_length = 160
