<title>County Line Neighbors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#e9ede9; --surface:#ffffff; --surface-2:#f4f6f3; --ink:#131a16; --muted:#5d6b64;
  --hair:#d1d9d3; --hair-strong:#b6c1ba; --map-bg:#e4e9e4; --map-land:#f6f8f5;
  --street:#c3ccc5; --boundary:#9aa8a0;
  --g0:#2f7a55; --g1:#2c6e9e; --g2:#7b5aa6; --g3:#b23a6c;
  --touch:#c8802a; --touch-fill:rgba(200,128,42,.42); --touch-line:#9c5f14;
  --s1:#2a78d6; --s1-fill:rgba(42,120,214,.42);
  --s2:#eb6834; --s2-fill:rgba(235,104,52,.42);
  --s3:#1baf7a; --s3-fill:rgba(27,175,122,.42);
  --county-fill:rgba(28,40,34,.42); --county-line:#1c2822; --bar:rgba(28,40,34,.10);
  --sel:#111a15; --sel-halo:#ffffff;
  --shadow:0 1px 2px rgba(19,26,22,.06),0 8px 24px rgba(19,26,22,.08);
}
:root:not([data-theme="light"]) { }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0e1412; --surface:#151d19; --surface-2:#1b2420; --ink:#e6ece7; --muted:#93a29a;
    --hair:#27332d; --hair-strong:#37453e; --map-bg:#0b100e; --map-land:#141b18;
    --street:#2c3833; --boundary:#4a5a52;
    --g0:#54b183; --g1:#5aa3d6; --g2:#a98ad4; --g3:#e0709f;
    --touch:#e0a04a; --touch-fill:rgba(224,160,74,.34); --touch-line:#e8b96f;
    --s1:#3987e5; --s1-fill:rgba(57,135,229,.40);
    --s2:#d95926; --s2-fill:rgba(217,89,38,.40);
    --s3:#199e70; --s3-fill:rgba(25,158,112,.40);
    --county-fill:rgba(214,226,219,.30); --county-line:#cfded6; --bar:rgba(214,226,219,.12);
    --sel:#ffffff; --sel-halo:#0b100e;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --paper:#0e1412; --surface:#151d19; --surface-2:#1b2420; --ink:#e6ece7; --muted:#93a29a;
  --hair:#27332d; --hair-strong:#37453e; --map-bg:#0b100e; --map-land:#141b18;
  --street:#2c3833; --boundary:#4a5a52;
  --g0:#54b183; --g1:#5aa3d6; --g2:#a98ad4; --g3:#e0709f;
  --touch:#e0a04a; --touch-fill:rgba(224,160,74,.34); --touch-line:#e8b96f;
  --s1:#3987e5; --s1-fill:rgba(57,135,229,.40);
  --s2:#d95926; --s2-fill:rgba(217,89,38,.40);
  --s3:#199e70; --s3-fill:rgba(25,158,112,.40);
  --county-fill:rgba(214,226,219,.30); --county-line:#cfded6; --bar:rgba(214,226,219,.12);
  --sel:#ffffff; --sel-halo:#0b100e;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;
}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--g1);outline-offset:2px}
.app{display:grid;grid-template-rows:auto 1fr;height:100dvh}

header.bar{
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  padding:12px 18px;background:var(--surface);border-bottom:1px solid var(--hair);
}
.brand h1{
  margin:0;font-family:Archivo,"IBM Plex Sans",sans-serif;font-weight:700;
  font-size:17px;letter-spacing:-.015em;
}
.brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.tally{display:flex;gap:22px;margin-left:auto;flex-wrap:wrap}
.tally div{display:flex;flex-direction:column}
.tally b{
  font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:500;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums;
}
.tally span{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}

.body{display:grid;grid-template-columns:342px 1fr;min-height:0}
aside{
  display:flex;flex-direction:column;min-height:0;
  background:var(--surface);border-right:1px solid var(--hair);
}
.filters{overflow-y:auto;flex:0 1 auto;min-height:96px}
.panel{padding:14px 16px;border-bottom:1px solid var(--hair);display:flex;flex-direction:column;gap:10px}
.panel h2{
  margin:0;font-size:10.5px;text-transform:uppercase;letter-spacing:.11em;
  color:var(--muted);font-weight:600;
}
.search{position:relative;display:flex}
.search input{
  width:100%;padding:9px 30px 9px 11px;border:1px solid var(--hair-strong);border-radius:7px;
  background:var(--surface-2);
}
.search button{
  position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;
  color:var(--muted);cursor:pointer;padding:4px 6px;border-radius:5px;
}
.checks{display:flex;flex-direction:column;gap:7px}
.check{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:13px}
.check input{accent-color:var(--g0);width:15px;height:15px;margin:0}
.swatch{width:11px;height:11px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.18)}
.swatch.dash{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.85) 0 2px,transparent 2px 4px)}
.check .n{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
details.grp{border-bottom:1px solid var(--hair)}
details.grp>summary{
  list-style:none;cursor:pointer;padding:13px 16px;display:flex;align-items:center;gap:8px;
  font-size:10.5px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);font-weight:600;
}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::after{content:'+';margin-left:auto;font-size:14px;line-height:1}
details.grp[open]>summary::after{content:'–'}
details.grp .inner{padding:0 16px 14px;display:flex;flex-direction:column;gap:2px}
.uses{display:flex;flex-direction:column}
.use{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12.5px;position:relative}
.use input{accent-color:var(--ink);width:14px;height:14px;margin:0;flex:none}
.use .lbl{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.use .lbl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.use .bar{height:4px;border-radius:2px;background:var(--bar);position:relative;overflow:hidden}
.use .bar i{position:absolute;top:0;bottom:0;left:0;border-radius:2px;background:var(--hair-strong);display:block}
.use .n{
  font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);
  font-variant-numeric:tabular-nums;flex:none;width:44px;text-align:right;
}
.use .hl{
  flex:none;width:19px;height:19px;border-radius:5px;border:1px dashed var(--hair-strong);
  background:none;cursor:pointer;padding:0;
}
.use .hl[data-slot]{border-style:solid;border-color:transparent}
.use .hl[data-slot="0"]{background:var(--s1)}
.use .hl[data-slot="1"]{background:var(--s2)}
.use .hl[data-slot="2"]{background:var(--s3)}
.note{font-size:11px;color:var(--muted);padding:2px 0 0}
.mini{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--muted)}
select{padding:8px 10px;border:1px solid var(--hair-strong);border-radius:7px;background:var(--surface-2);width:100%}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--hair-strong);border-radius:7px;overflow:hidden}
.seg button{flex:1;border:0;background:none;padding:7px 6px;font-size:12px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:600}
.listhead{display:flex;align-items:baseline;gap:8px;padding:10px 16px 6px}
.listhead strong{font-family:"IBM Plex Mono",monospace;font-weight:500;font-variant-numeric:tabular-nums}
.listhead span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
.listwrap{flex:1 1 46%;overflow-y:auto;min-height:180px}
.rows{position:relative}
.row{
  position:absolute;left:0;right:0;padding:9px 16px;border-bottom:1px solid var(--hair);
  cursor:pointer;display:flex;flex-direction:column;gap:2px;
}
.row:hover{background:var(--surface-2)}
.row[aria-selected="true"]{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--touch)}
.row .a{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .o{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);display:flex;gap:9px}
.dot{width:7px;height:7px;border-radius:50%;flex:none;align-self:center}

.map{position:relative;min-width:0;background:var(--map-bg)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
canvas.drag{cursor:grabbing}
.overlay{position:absolute;pointer-events:none}
.legend{
  left:14px;bottom:14px;background:var(--surface);border:1px solid var(--hair);border-radius:9px;
  padding:10px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;font-size:12px;
}
.legend .k{display:flex;align-items:center;gap:8px}
.legend .sw{width:13px;height:11px;border-radius:3px;border:1px solid rgba(0,0,0,.25);flex:none}
.legend .sw.dash{
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.85) 0 2px,transparent 2px 4px);
}
.legend .t{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.zoom{right:14px;top:14px;display:flex;flex-direction:column;gap:6px;pointer-events:auto}
.zoom button{
  width:34px;height:34px;border:1px solid var(--hair);background:var(--surface);border-radius:8px;
  cursor:pointer;box-shadow:var(--shadow);font-size:16px;line-height:1;
}
.zoom button.wide{width:34px;font-size:11px}
.scalebar{
  right:14px;bottom:14px;display:flex;flex-direction:column;align-items:flex-end;gap:3px;
  font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink);
  background:var(--surface);border:1px solid var(--hair);border-radius:7px;padding:5px 8px;box-shadow:var(--shadow);
}
.scalebar .b{height:4px;background:var(--ink);border-radius:1px}
.hint{
  left:50%;transform:translateX(-50%);bottom:16px;background:var(--surface);border:1px solid var(--hair);
  border-radius:20px;padding:6px 14px;font-size:12px;color:var(--muted);box-shadow:var(--shadow);
}
.loading{
  position:absolute;inset:0;display:grid;place-items:center;background:var(--map-bg);z-index:5;text-align:center;
}
.loading p{margin:8px 0 0;color:var(--muted);font-size:13px}
.loading .lb{font-family:Archivo,sans-serif;font-weight:600;font-size:15px}

.detail{
  position:absolute;right:0;top:0;bottom:0;width:352px;background:var(--surface);
  border-left:1px solid var(--hair);box-shadow:var(--shadow);overflow-y:auto;
  transform:translateX(100%);transition:transform .22s ease;
}
.detail.open{transform:none}
@media (prefers-reduced-motion:reduce){.detail{transition:none}}
.detail .top{padding:16px 18px 12px;border-bottom:1px solid var(--hair);position:sticky;top:0;background:var(--surface)}
.detail h3{margin:0;font-family:Archivo,sans-serif;font-size:16px;letter-spacing:-.01em;text-wrap:balance}
.detail .sub{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.detail .close{position:absolute;right:12px;top:12px;border:1px solid var(--hair);background:var(--surface-2);border-radius:7px;width:28px;height:28px;cursor:pointer}
.kv{display:grid;grid-template-columns:112px 1fr;gap:7px 12px;padding:14px 18px;font-size:13px}
.kv dt{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;padding-top:2px}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
.kv dd.mono{font-family:"IBM Plex Mono",monospace}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{
  font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--hair-strong);
  background:var(--surface-2);display:inline-flex;align-items:center;gap:5px;
}
.detail .sect{padding:0 18px 16px}
.detail .sect h4{margin:12px 0 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.detail ul{margin:0;padding-left:16px;font-size:12.5px}
.detail a.ext{
  display:inline-block;margin:4px 18px 20px;padding:8px 12px;border-radius:8px;background:var(--ink);
  color:var(--paper);text-decoration:none;font-size:12.5px;font-weight:600;
}
.foot{padding:12px 16px;font-size:11px;color:var(--muted);border-top:1px solid var(--hair)}
.foot code{font-family:"IBM Plex Mono",monospace}
@media (max-width:900px){
  .body{grid-template-columns:1fr}
  aside{position:absolute;z-index:6;inset:0 auto 0 0;width:320px;transform:translateX(-100%);transition:transform .2s}
  aside.open{transform:none}
  .tally{gap:14px}
}
</style>
